<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bgGrad)"/>

  <!-- Top accent bar -->
  <rect width="1200" height="3" fill="url(#lineGrad)"/>

  <!-- Left ring: user -->
  <circle cx="130" cy="142" r="58" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.45"/>
  <circle cx="130" cy="142" r="40" fill="#7c3aed" opacity="0.07"/>
  <circle cx="130" cy="131" r="16" fill="#7c3aed" opacity="0.45"/>
  <path d="M104,172 Q117,154 130,152 Q143,154 156,172" fill="#7c3aed" opacity="0.35"/>

  <!-- Dotted connector -->
  <line x1="196" y1="142" x2="270" y2="142" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="233" cy="142" r="3" fill="#4b5563" opacity="0.6"/>
  <polygon points="266,137 278,142 266,147" fill="#4b5563"/>

  <!-- Right ring: historical figure -->
  <circle cx="336" cy="142" r="58" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.45"/>
  <circle cx="336" cy="142" r="40" fill="#2563eb" opacity="0.07"/>
  <path d="M317,132 L320,119 L326,128 L332,113 L336,126 L340,113 L346,128 L352,119 L355,132"
        fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.55" stroke-linejoin="round"/>
  <circle cx="336" cy="152" r="13" fill="#2563eb" opacity="0.38"/>

  <!-- Title -->
  <text x="756" y="112"
        font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"
        font-size="50" font-weight="700" fill="#e6edf3" text-anchor="middle"
        filter="url(#softglow)">
    History Soul Matcher
  </text>

  <!-- JP subtitle -->
  <text x="756" y="158"
        font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"
        font-size="19" fill="#8b949e" text-anchor="middle">
    自撮り写真から、最も「魂が似ている」歴史上の人物を見つける
  </text>

  <!-- Tags -->
  <rect x="573" y="188" width="110" height="24" rx="12" fill="#7c3aed" opacity="0.18"/>
  <text x="628" y="204"
        font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="12" fill="#a78bfa" text-anchor="middle">Claude Vision</text>

  <rect x="695" y="188" width="152" height="24" rx="12" fill="#2563eb" opacity="0.18"/>
  <text x="771" y="204"
        font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="12" fill="#60a5fa" text-anchor="middle">Deterministic Scoring</text>

  <rect x="859" y="188" width="152" height="24" rx="12" fill="#059669" opacity="0.18"/>
  <text x="935" y="204"
        font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="12" fill="#34d399" text-anchor="middle">200 Historical Figures</text>

  <!-- Bottom accent bar -->
  <rect y="277" width="1200" height="3" fill="url(#lineGrad)" opacity="0.4"/>
</svg>
